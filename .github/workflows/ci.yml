name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with coverage
      run: |
        pytest --cov=src --cov=InternMailer --cov-report=xml --cov-report=term-missing --cov-fail-under=80
      env:
        # Add any necessary environment variables here
        PYTHONPATH: ${{ github.workspace }}

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  coverage-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Get current coverage
      run: |
        pytest --cov=src --cov=InternMailer --cov-report=json
        echo "CURRENT_COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")" >> $GITHUB_ENV

    - name: Checkout base branch
      run: |
        git checkout ${{ github.event.pull_request.base.sha }}

    - name: Get base coverage
      run: |
        pytest --cov=src --cov=InternMailer --cov-report=json
        echo "BASE_COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")" >> $GITHUB_ENV

    - name: Check coverage regression
      run: |
        echo "Current coverage: $CURRENT_COVERAGE%"
        echo "Base coverage: $BASE_COVERAGE%"
        python -c "
        import sys
        current = float('$CURRENT_COVERAGE')
        base = float('$BASE_COVERAGE')
        regression_threshold = 2.0  # Allow up to 2% regression
        
        if current < base - regression_threshold:
            print(f'❌ Coverage regression detected!')
            print(f'Coverage dropped from {base:.2f}% to {current:.2f}%')
            print(f'Regression of {base - current:.2f}% exceeds threshold of {regression_threshold}%')
            sys.exit(1)
        elif current < base:
            print(f'⚠️  Coverage slightly decreased from {base:.2f}% to {current:.2f}%')
            print('This is within the acceptable threshold.')
        else:
            print(f'✅ Coverage improved from {base:.2f}% to {current:.2f}%')
        "

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Run black (code formatting check)
      run: black --check --diff .

    - name: Run isort (import sorting check)
      run: isort --check-only --diff .

    - name: Run flake8 (linting)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
