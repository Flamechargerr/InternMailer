name: InternMailer UI Smoke Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: Start UI in background
        run: |
          python web/web_dashboard.py &
          sleep 3

      - name: Run smoke test
        run: |
          python smoke_test_dashboard.py

      - name: Stop UI
        run: |
          pkill -f "python web/web_dashboard.py" || true
