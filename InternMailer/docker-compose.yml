version: '3.8'

services:
  internmailer-audit:
    build: .
    container_name: internmailer-failure-audit
    ports:
      - "8501:8501"  # Streamlit
      - "11434:11434"  # Ollama
    volumes:
      - ./test_failures.log:/app/test_failures.log
      - ./BASELINE_FAILURE_AUDIT_REPORT.md:/app/BASELINE_FAILURE_AUDIT_REPORT.md
    environment:
      - GMAIL_USER=test@gmail.com
      - GMAIL_APP_PASSWORD=testpassword123
      - RESUME_PATH=resumes/CV_Anamay_Modern.pdf
    command: >
      bash -c "
        echo 'Starting InternMailer Failure Audit...' &&
        python test_failures.py &&
        echo 'Audit complete. Starting Streamlit for manual testing...' &&
        streamlit run app.py --server.address=0.0.0.0
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
