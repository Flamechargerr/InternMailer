# Job Sources Configuration for InternMailer
# ===========================================
# This file contains all sources for job discovery

# ATS (Applicant Tracking System) sources
# These are company career pages with structured job data
ats_sources:
  - name: greenhouse
    companies:
      - "GitHub"
      - "Shopify"
      - "Stripe"
      - "Airbnb"
      - "Dropbox"
      - "Pinterest"
      - "Reddit"
      - "Square"
      - "Twitch"
