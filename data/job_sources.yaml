# Sources that require login (will be skipped if no credentials provided)
login_required_sources:
  - linkedin
  - indeed
  - glassdoor
  - monster
  - dice

# Job search parameters (used when querying APIs)
search_parameters:
  # Keywords for internship searches
  keywords:
    - "intern"
    - "internship"
    - "co-op"
    - "student"
    - "graduate"
    - "entry level"
    - "new grad"
  
  # Locations (can be empty for remote)
  locations:
    - "Remote"
    - "India"
    - "United States"
    - "Canada"
    - "United Kingdom"
    - "Germany"
    - "Australia"
  
  # Job categories
  categories:
    - "Software Engineering"
    - "Data Science"
    - "Machine Learning"
    - "Product Management"
    - "UX/UI Design"
    - "DevOps"
    - "Cloud Engineering"
    - "Cybersecurity"
  
  # Employment types
  employment_types:
    - "Internship"
    - "Full-time"
    - "Part-time"
    - "Contract"

# Rate limiting configuration
rate_limits:
  # Maximum requests per minute per source
  requests_per_minute: 30
  
  # Delay between requests in seconds
  delay_between_requests: 2.0
  
  # Maximum concurrent requests
  max_concurrent: 5

# Fallback configuration
fallbacks:
  # If primary sources fail, use these fallback sources
  primary_fallback_sources:
    - "remotive"
    - "arbeitnow"
  
  # If all API sources fail, use these static company pages
  static_fallback_urls:
    - "https://careers.google.com/"
    - "https://careers.microsoft.com/"
    - "https://www.amazon.jobs/"
  
  # Maximum retries for failed sources
  max_retries: 3
  
  # Retry delay in seconds
  retry_delay: 5

# Validation rules
validation:
  # Minimum required fields for a job posting to be valid
  required_fields:
    - "title"
    - "company"
    - "url"
    - "location"
  
  # Fields that should be normalized
  normalize_fields:
    - "title"
    - "company"
    - "location"
  
  # Maximum age of job postings in days
  max_age_days: 30
  
  # Minimum description length
  min_description_length: 50