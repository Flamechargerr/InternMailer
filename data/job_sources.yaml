# Job board APIs (public APIs that return job listings)
job_board_apis:
  - name: remotive
    url: https://remotive.com/api/remote-jobs
    description: "Remote jobs API"
    requires_key: false
  
  - name: arbeitnow
    url: https://www.arbeitnow.com/api/job-board-api
    description: "European job board API"
    requires_key: false
  
  - name: github_jobs
    url: https://jobs.github.com/positions.json
    description: "GitHub Jobs API (deprecated but may still work)"
    requires_key: false
  
  - name: muse
    url: https://www.themuse.com/api/public/jobs
    description: "The Muse job board API"
    requires_key: false

