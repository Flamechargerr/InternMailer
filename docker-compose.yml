services:
  web:
    build: .
    container_name: internmailer-web
    ports:
      - "5050:5050"
    environment:
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./assets/campaign_results:/app/assets/campaign_results
      - ./backups:/app/backups
      - ./cache:/app/cache
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.insert(0,'src'); from middleware.health_check import get_health_checker; hc = get_health_checker(); exit(0 if hc.run_all_checks()['status'] == 'pass' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - internmailer-network

  worker:
    build: .
    container_name: internmailer-worker
    command: python main.py --scheduler
    environment:
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./assets/campaign_results:/app/assets/campaign_results
      - ./backups:/app/backups
      - ./cache:/app/cache
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - web
    networks:
      - internmailer-network

networks:
  internmailer-network:
    driver: bridge

volumes:
  data:
  logs:
  backups:
  cache:
