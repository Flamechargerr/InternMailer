[global]
# Global configurations

# Development mode (set to false in production)
developmentMode = false

# Show warning about newer Python versions
showWarningOnDirectExecution = false

[server]
# Server configurations
port = 8502
baseUrlPath = ""
enableCORS = true
enableXsrfProtection = false
maxUploadSize = 200
maxMessageSize = 200
enableWebsocketCompression = false
enableStaticServing = true

# Headless mode (useful for deployment)
headless = false

# Run on save (development)
runOnSave = false

# Allow running without a file watcher
allowRunOnSave = true

# Address to bind the server to
address = "0.0.0.0"

[browser]
# Browser configurations
serverAddress = "localhost"
gatherUsageStats = false
serverPort = 8502

[theme]
# Professional UI Theme configuration
# Modern brand colors with accessibility in mind
primaryColor = "#0066CC"          # Professional blue for buttons and links
backgroundColor = "#FFFFFF"       # Clean white background
secondaryBackgroundColor = "#F8F9FA"  # Light gray for cards and sidebars
textColor = "#212529"            # High contrast dark text
font = "sans serif"              # Clean, readable font
base = "light"                   # Light theme base

[runner]
# Script runner configurations
magicEnabled = true
postScriptGC = true
fastReruns = true
enforceSerializableSessionState = false

[logger]
# Logging configurations
level = "info"

[mapbox]
# Mapbox token (if using map components)
# token = "your_mapbox_token_here"

[s3]
# AWS S3 configurations (if using S3 for file storage)
# bucket = "your-bucket-name"
# region = "us-east-1"
# accessKeyId = "your-access-key"
# secretAccessKey = "your-secret-key"
