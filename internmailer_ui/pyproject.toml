[tool.poetry]
name = "internmailer-ui"
version = "0.1.0"
description = "Streamlit-based web interface for InternMailer email management system"
authors = ["InternMailer Team <contact@internmailer.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/internmailer/internmailer-ui"
repository = "https://github.com/internmailer/internmailer-ui"
documentation = "https://github.com/internmailer/internmailer-ui#readme"
keywords = ["email", "marketing", "streamlit", "ui", "campaign-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.9"
streamlit = "^1.32.0"
streamlit-authenticator = "^0.2.3"
pandas = "^2.0.0"
plotly = "^5.18.0"
numpy = "^1.24.0"
requests = "^2.31.0"
httpx = "^0.27.0"
email-validator = "^2.1.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
cryptography = "^41.0.0"
python-dateutil = "^2.8.0"
pillow = "^10.0.0"
openpyxl = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.8.0"
pre-commit = "^3.5.0"
isort = "^5.12.0"

[tool.poetry.group.test.dependencies]
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.12.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
internmailer-ui = "app:main"

# Tool configurations
[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["internmailer_ui"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "plotly.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=internmailer_ui --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["internmailer_ui"]
omit = ["tests/*", "*/venv/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
